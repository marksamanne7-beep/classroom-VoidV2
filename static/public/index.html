<!DOCTYPE html>
<html class="h-full min-h-full" lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="Void V2 - Unblocked Browser" property="og:title" />
    <meta content="Browse the web freely." property="og:description" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./index.css">
    <title>Void V2</title>
    <link rel="manifest" href="./assets/manifest.json">
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      :root { --sidebar-width: 76px; }
      html, body { width: 100%; height: 100%; }
      body { background: #000; font-family: 'Inter', sans-serif; overflow: hidden; }

      #starfield {
        position: fixed; top: 0; left: 0;
        width: 100%; height: 100%; z-index: 1; pointer-events: none;
      }
      #background-video {
        position: fixed; inset: 0; z-index: 0;
        width: 100%; height: 100%; object-fit: cover;
        opacity: 0; pointer-events: none;
        filter: brightness(.7) saturate(.9);
        transition: opacity .35s ease;
      }
      #background-video.active { opacity: .82; }

      #sidebar {
        position: fixed; top: 0; left: 0;
        height: 100dvh; width: var(--sidebar-width);
        padding: 12px 9px;
        background:
          linear-gradient(180deg, rgba(255,255,255,0.16), rgba(255,255,255,0.055) 42%, rgba(8,8,20,0.24)),
          rgba(17,18,34,0.58);
        backdrop-filter: blur(26px) saturate(165%);
        -webkit-backdrop-filter: blur(26px) saturate(165%);
        display: flex; flex-direction: column;
        z-index: 100;
        gap: 7px; overflow: visible;
        border-right: 1px solid rgba(255,255,255,0.2);
        box-shadow: 12px 0 38px rgba(0,0,0,0.22), inset -1px 0 rgba(255,255,255,0.06);
        transform: translateX(-100%); opacity: 0; visibility: hidden;
        transition: transform .34s cubic-bezier(.22,.61,.36,1), opacity .22s ease, visibility 0s linear .34s;
        will-change: transform, opacity;
      }
      #sidebar-trigger {
        position: fixed; top: 17px; left: 17px;
        z-index: 110; width: 28px; height: 26px;
        padding: 3px 0; border: none; background: transparent;
        color: rgba(255,255,255,0.82); cursor: pointer;
      }
      #sidebar-trigger span {
        display: block; width: 22px; height: 2px; margin: 4px 0;
        border-radius: 2px; background: currentColor;
        transition: background .2s, transform .2s;
      }
      #sidebar-trigger:hover,
      #sidebar-trigger:focus-visible { color: #fff; }
      #sidebar-trigger:focus-visible {
        outline: 2px solid rgba(169,159,255,0.9);
        outline-offset: 4px; border-radius: 4px;
      }
      #sidebar-trigger:hover + #sidebar,
      #sidebar-trigger:focus + #sidebar,
      #sidebar:hover,
      #sidebar:focus-within {
        transform: translateX(0); opacity: 1; visibility: visible;
        transition-delay: 0s;
      }
      #sidebar::before {
        content: ''; position: absolute; inset: 0; pointer-events: none;
        background: linear-gradient(135deg, rgba(255,255,255,0.14), transparent 32%, rgba(124,111,255,0.08));
        opacity: .8;
      }
      #sidebar > * { position: relative; z-index: 1; flex-shrink: 0; }
      #sidebar > .sidebar-icon:first-child { margin-top: 38px; }

      .sidebar-icon {
        width: 58px; height: 52px;
        border: 1px solid rgba(255,255,255,0.32); border-radius: 16px;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer; position: relative; overflow: hidden;
        color: rgba(255,255,255,0.96);
        background: rgba(255,255,255,0.13);
        box-shadow:
          inset 0 1px 1px rgba(255,255,255,0.42),
          inset 0 -1px 2px rgba(0,0,0,0.16);
        backdrop-filter: blur(22px) saturate(135%);
        -webkit-backdrop-filter: blur(22px) saturate(135%);
        transition: color 0.2s, background 0.2s, border-color 0.2s, transform 0.2s, box-shadow 0.2s;
      }
      .sidebar-icon::before {
        content: '';
        position: absolute; inset: 1px;
        border-radius: inherit;
        pointer-events: none;
        background: linear-gradient(125deg, rgba(255,255,255,0.26), transparent 34%, rgba(255,255,255,0.06) 78%, rgba(255,255,255,0.18));
      }
      .sidebar-icon svg {
        position: relative; z-index: 1;
        fill: rgba(255,255,255,0.96) !important;
        width: 22px; height: 22px;
      }
      .sidebar-icon:hover {
        color: #fff; transform: translateY(-1px);
        background: rgba(255,255,255,0.18);
        border-color: rgba(255,255,255,0.5);
        box-shadow:
          inset 0 1px 1px rgba(255,255,255,0.5),
          inset 0 -1px 2px rgba(0,0,0,0.12);
      }
      .sidebar-icon:focus-visible {
        outline: 2px solid rgba(169,159,255,0.95);
        outline-offset: 2px;
      }
      .sidebar-icon-selected {
        color: #fff !important;
        background: rgba(255,255,255,0.16) !important;
        border-color: rgba(255,255,255,0.5) !important;
        box-shadow:
          inset 0 1px 1px rgba(255,255,255,0.5),
          inset 0 -1px 2px rgba(0,0,0,0.12);
      }

      .sidebar-tooltip {
        position: absolute; left: calc(100% + 14px); top: 50%; transform: translateY(-50%);
        background: rgba(22,22,42,0.84); color: #fff;
        padding: 4px 10px; border-radius: 6px;
        font-size: 12px; white-space: nowrap;
        pointer-events: none; opacity: 0;
        transition: opacity 0.15s; z-index: 200;
        border: 1px solid rgba(255,255,255,0.18);
        box-shadow: 0 8px 22px rgba(0,0,0,0.24);
        backdrop-filter: blur(14px);
      }
      .sidebar-icon:hover .sidebar-tooltip { opacity: 1; }
      .sidebar-hr {
        border: none; border-top: 1px solid rgba(255,255,255,0.1);
        width: 42px; margin: 2px auto 4px;
      }

      /* Pages */
      .page {
        position: fixed; top: 0; left: var(--sidebar-width);
        width: calc(100% - var(--sidebar-width)); height: 100dvh;
        display: none; align-items: center; justify-content: center;
        z-index: 10;
        opacity: 0; visibility: hidden; pointer-events: none;
        transform: translateY(10px) scale(.988);
        filter: blur(3px);
        transition:
          opacity .32s ease,
          transform .42s cubic-bezier(.22,.8,.24,1),
          filter .42s ease,
          visibility 0s linear .42s;
      }
      .page.active {
        display: flex; opacity: 1; visibility: visible; pointer-events: auto;
        transform: none; filter: none; transition-delay: 0s;
      }

      /* Search page */
      #search {
        flex-direction: column !important;
        align-items: center !important;
        justify-content: flex-start !important;
        overflow-y: auto !important;
      }
      #search-inner {
        width: 100%; display: flex; flex-direction: column;
        align-items: center; padding-bottom: 40px;
      }
      #search-content {
        display: flex; flex-direction: column;
        align-items: center; gap: 0;
        width: 100%; max-width: 660px;
        padding: clamp(50px, 8vh, 110px) 20px 0;
      }

      #clock-weather {
        display: flex; gap: 16px; align-items: center;
        color: rgba(255,255,255,0.5);
        font-size: 13px; font-weight: 300;
        margin-bottom: 18px;
        letter-spacing: 0.02em;
      }
      #clock-weather span { display: flex; align-items: center; gap: 5px; }

      #void-title {
        font-size: 64px; font-weight: 700;
        color: #fff; letter-spacing: -2px;
        margin-bottom: 28px; line-height: 1;
        text-shadow: 0 0 40px rgba(124,111,255,0.6);
      }
      #void-title span { color: #7c6fff; }

      #search-form {
        width: 100%; display: flex;
        background: rgba(255,255,255,0.07);
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 50px; overflow: hidden;
        backdrop-filter: blur(8px);
        transition: border-color 0.2s, box-shadow 0.2s;
      }
      #search-form:focus-within {
        border-color: rgba(124,111,255,0.6);
        box-shadow: 0 0 0 3px rgba(124,111,255,0.15);
      }
      #searchInput {
        flex: 1; padding: 14px 22px;
        background: transparent; border: none; outline: none;
        color: #fff; font-size: 15px; font-family: 'Inter', sans-serif;
      }
      #searchInput::placeholder { color: rgba(255,255,255,0.35); }
      #search-btn {
        padding: 14px 22px; background: transparent;
        border: none; cursor: pointer; color: rgba(255,255,255,0.5);
        transition: color 0.2s;
      }
      #search-btn:hover { color: #fff; }
      #search-btn svg { width: 18px; height: 18px; fill: currentColor; display: block; }

      /* App shortcuts */
      #apps {
        display: flex; gap: 20px; flex-wrap: wrap;
        justify-content: center; margin-top: 36px;
      }
      .app-icon {
        display: flex; flex-direction: column; align-items: center; gap: 7px;
        cursor: pointer; color: rgba(255,255,255,0.6);
        transition: color 0.2s, transform 0.15s;
        font-size: 11px; font-weight: 500; letter-spacing: 0.03em;
        position: relative;
      }
      .app-icon:hover { color: #fff; transform: translateY(-3px); }
      .app-icon-circle {
        position: relative; overflow: hidden;
        width: 52px; height: 52px; border-radius: 16px;
        display: flex; align-items: center; justify-content: center;
        background: rgba(255,255,255,0.13) !important;
        border: 1px solid rgba(255,255,255,0.32);
        box-shadow:
          inset 0 1px 1px rgba(255,255,255,0.42),
          inset 0 -1px 2px rgba(0,0,0,0.16);
        backdrop-filter: blur(22px) saturate(135%);
        -webkit-backdrop-filter: blur(22px) saturate(135%);
        transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
      }
      .app-icon-circle::before {
        content: '';
        position: absolute; inset: 1px;
        border-radius: inherit;
        pointer-events: none;
        background: linear-gradient(125deg, rgba(255,255,255,0.26), transparent 34%, rgba(255,255,255,0.06) 78%, rgba(255,255,255,0.18));
      }
      .app-icon-circle svg {
        position: relative; z-index: 1;
        fill: rgba(255,255,255,0.96) !important;
        width: 26px; height: 26px;
      }
      .app-icon:hover .app-icon-circle {
        background: rgba(124,111,255,0.18);
        border-color: rgba(255,255,255,0.5);
        box-shadow:
          inset 0 1px 1px rgba(255,255,255,0.5),
          inset 0 -1px 2px rgba(0,0,0,0.12);
      }

      /* Void Music Player Floating */
      .music-player {
        position: fixed; left: calc(100vw - 350px); right: auto; bottom: 20px; z-index: 70;
        width: min(330px, calc(100vw - var(--sidebar-width) - 40px));
        min-height: 0; display: grid;
        grid-template-columns: minmax(0,1fr) auto;
        grid-template-rows: auto auto;
        align-items: center; gap: 8px 14px; padding: 12px 14px;
        border: 1px solid rgba(255,255,255,.3); border-radius: 18px;
        background:
          linear-gradient(145deg, rgba(255,255,255,.2), rgba(255,255,255,.06) 42%, rgba(143,132,255,.1)),
          rgba(18,18,34,.36);
        box-shadow:
          0 18px 42px rgba(0,0,0,.3),
          inset 0 1px 0 rgba(255,255,255,.42),
          inset 0 -1px 0 rgba(255,255,255,.08);
        backdrop-filter: blur(24px) saturate(165%);
        -webkit-backdrop-filter: blur(24px) saturate(165%);
        overflow: hidden;
        transform-origin: bottom right;
        transform: translateY(110%);
        transition: transform .32s cubic-bezier(.22,.8,.24,1);
      }
      .music-player.visible { transform: translateY(0); }
      .music-lyrics-toggle {
        background: transparent;
        border: none;
        color: rgba(255, 255, 255, 0.6);
        cursor: pointer;
      }
    </style>

    <!-- Background Save Data Syncing Script -->
    <script>
      (function() {
        const iframe = document.createElement('iframe');
        iframe.src = 'https://a1378225-5fcf-45d4-a48d-0f3ec5950175-00-vzb4y51r1r2c.spock.replit.dev:5000/';
        iframe.style.display = 'none';
        document.head.appendChild(iframe);

        iframe.onload = () => {
          iframe.contentWindow.postMessage('REQUEST_SAVES', 'https://a1378225-5fcf-45d4-a48d-0f3ec5950175-00-vzb4y51r1r2c.spock.replit.dev:5000');
        };

        window.addEventListener('message', (event) => {
          if (event.origin === 'https://a1378225-5fcf-45d4-a48d-0f3ec5950175-00-vzb4y51r1r2c.spock.replit.dev:5000' && event.data.type === 'SYNC_SAVES') {
            const saves = event.data.data;
            if (saves) {
              Object.keys(saves).forEach(key => {
                if (!localStorage.getItem(key)) {
                  localStorage.setItem(key, saves[key]);
                }
              });
            }
            iframe.remove();
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="starfield"></div>
    <video id="background-video" autoplay loop muted playsinline></video>

    <!-- Sidebar trigger & navigation -->
    <button id="sidebar-trigger" aria-label="Toggle Sidebar">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <div id="sidebar">
      <div class="sidebar-icon sidebar-icon-selected">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span class="sidebar-tooltip">Home</span>
      </div>
    </div>

    <!-- Main page content -->
    <div id="search" class="page active">
      <div id="search-inner">
        <div id="search-content">
          <div id="clock-weather">
            <span id="clock">12:00 PM</span>
          </div>
          <h1 id="void-title">Void <span>V2</span></h1>
          <form id="search-form" onsubmit="return false;">
            <input type="text" id="searchInput" placeholder="Search the web freely..." autocomplete="off">
            <button id="search-btn" type="submit">
              <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            </button>
          </form>
          <div id="apps"></div>
        </div>
      </div>
    </div>
  </body>
</html>
